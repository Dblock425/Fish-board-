name: Refresh Bite Board data

# Fetches San Diego tide + marine data on GitHub's servers (which have open
# internet) and commits data.json back to the repo. The Bite Board's Claude
# refresh then reads data.json to update the live board.

on:
  schedule:
    - cron: "0 3,12 * * *"   # 8 PM & 5 AM Pacific, an hour before the board refresh
  workflow_dispatch:          # lets you (or Claude) run it on demand

permissions:
  contents: write             # allow the robot to commit data.json

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch fresh data
        run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name  "bite-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No change in data.json"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
